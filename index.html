<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kerja Harian Laundry</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM Production -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-16">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // URL default dari link Google Sheet Anda
        const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwh7fvvRoUDxQADb42ktIkrWqJSHAn_afwH1Pa5nVWW4ajn9tcZsSeI8GuKOS9gW70B4A/exec";
        const JOB_LIST = ["CUCI", "DRY", "LIPAT", "SETRIKA", "PACKING", "CUCI SATUAN"];

        function App() {
            const [selectedImage, setSelectedImage] = useState(null);
            const [selectedJob, setSelectedJob] = useState("DRY");
            const [employeeName, setEmployeeName] = useState("");
            const [scriptUrl, setScriptUrl] = useState(DEFAULT_SCRIPT_URL);
            
            // Pengaturan API Key & Admin
            const [geminiApiKey, setGeminiApiKey] = useState(""); 
            const [showSettings, setShowSettings] = useState(false);
            const [isTestingKey, setIsTestingKey] = useState(false);
            const [keyTestResult, setKeyTestResult] = useState(null);

            const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
            const [adminPasswordInput, setAdminPasswordInput] = useState("");
            const [adminPassword, setAdminPassword] = useState("1234");
            const [newAdminPassword, setNewAdminPassword] = useState("");
            const [isChangingPass, setIsChangingPass] = useState(false);

            // Status Proses
            const [isProcessing, setIsProcessing] = useState(false);
            const [processStep, setProcessStep] = useState("");
            const [syncStatus, setSyncStatus] = useState(""); 
            const [errorMsg, setErrorMsg] = useState("");
            const [successMsg, setSuccessMsg] = useState("");
            
            const [laundryData, setLaundryData] = useState([]);
            const [editingId, setEditingId] = useState(null);
            const [editValue, setEditValue] = useState("");

            useEffect(() => {
                const savedData = localStorage.getItem("fsl_records_v2");
                if (savedData) {
                    try { setLaundryData(JSON.parse(savedData)); } catch (e) { setLaundryData([]); }
                }
                const savedEmp = localStorage.getItem("fsl_employee");
                if (savedEmp) setEmployeeName(savedEmp);

                const savedUrl = localStorage.getItem("fsl_script_url");
                if (savedUrl) setScriptUrl(savedUrl);

                const savedApiKey = localStorage.getItem("fsl_gemini_api_key");
                if (savedApiKey) {
                    setGeminiApiKey(savedApiKey);
                } else {
                    setShowSettings(true);
                }

                const savedPass = localStorage.getItem("fsl_admin_pass");
                if (savedPass) setAdminPassword(savedPass);
            }, []);

            const saveLocalData = (newData) => {
                setLaundryData(newData);
                localStorage.setItem("fsl_records_v2", JSON.stringify(newData));
            };

            // Fungsi Kompresi Gambar Otomatis agar cepat dikirim ke AI
            const compressImage = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement("canvas");
                            const MAX_SIZE = 1000;
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > MAX_SIZE) {
                                    height *= MAX_SIZE / width;
                                    width = MAX_SIZE;
                                }
                            } else {
                                if (height > MAX_SIZE) {
                                    width *= MAX_SIZE / height;
                                    height = MAX_SIZE;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext("2d");
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL("image/jpeg", 0.8));
                        };
                        img.onerror = (err) => reject(err);
                    };
                    reader.onerror = (err) => reject(err);
                });
            };

            const handleImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setErrorMsg("");
                setSuccessMsg("");
                try {
                    const compressedDataUrl = await compressImage(file);
                    setSelectedImage(compressedDataUrl);
                } catch (err) {
                    setErrorMsg("Gagal memuat gambar. Coba gunakan foto lain.");
                }
            };

            const isDuplicate = (resi) => {
                if (!resi || resi === "-") return false;
                return laundryData.some(item => 
                    item.resi.toLowerCase().trim() === resi.toLowerCase().trim() &&
                    item.pekerjaan === selectedJob
                );
            };

            // FITUR BARU: Test apakah API Key aktif dan bekerja
            const handleTestApiKey = async () => {
                const cleanKey = geminiApiKey ? geminiApiKey.trim() : "";
                if (!cleanKey) {
                    setKeyTestResult({ ok: false, msg: "Masukkan API Key terlebih dahulu!" });
                    return;
                }
                setIsTestingKey(true);
                setKeyTestResult(null);

                const modelsToTry = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"];
                let workingModel = null;
                let lastErr = "";

                for (const model of modelsToTry) {
                    try {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cleanKey}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: "Balas OK" }] }]
                            })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            workingModel = model;
                            break;
                        } else {
                            lastErr = data?.error?.message || `Status ${res.status}`;
                        }
                    } catch (e) {
                        lastErr = e.message;
                    }
                }

                setIsTestingKey(false);
                if (workingModel) {
                    setKeyTestResult({ ok: true, msg: `✅ Koneksi Berhasil! Menggunakan mesin: ${workingModel}` });
                } else {
                    setKeyTestResult({ ok: false, msg: `❌ API Key Gagal: ${lastErr}` });
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPasswordInput === adminPassword) {
                    setIsAdminUnlocked(true);
                    setErrorMsg("");
                    setAdminPasswordInput("");
                } else {
                    alert("Kata Sandi Admin Salah!");
                    setAdminPasswordInput("");
                }
            };

            const handleSaveNewPassword = (e) => {
                e.preventDefault();
                if (!newAdminPassword.trim()) return;
                setAdminPassword(newAdminPassword);
                localStorage.setItem("fsl_admin_pass", newAdminPassword);
                setNewAdminPassword("");
                setIsChangingPass(false);
                alert("Kata Sandi Admin berhasil diubah!");
            };

            // Mengirim ke Google Sheet menggunakan text/plain agar bebas blokir CORS
            const sendToGoogleSheet = async (rowItem) => {
                if (!scriptUrl) return;
                setSyncStatus("syncing");
                try {
                    const payload = JSON.stringify({
                        action: "addData",
                        tanggalInput: new Date().toLocaleString("id-ID"),
                        namaKaryawan: employeeName || "-",
                        namaPelanggan: rowItem.nama,
                        noNota: rowItem.resi,
                        waktu: rowItem.waktu,
                        pekerjaan: rowItem.pekerjaan,
                        berat: rowItem.berat
                    });

                    await fetch(scriptUrl.trim(), {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: payload
                    });
                    setSyncStatus("synced");
                } catch (error) {
                    console.error("Gagal sinkronisasi ke Sheet:", error);
                    setSyncStatus("failed");
                }
            };

            // FITUR BARU: Simulasi Test Tanpa Foto
            const handleRunSimulation = async () => {
                setErrorMsg("");
                setSuccessMsg("");
                const randomSuffix = Math.floor(100 + Math.random() * 900);
                const dummyEntry = {
                    id: Date.now().toString(),
                    nama: "Cynthia Kaliana (DLV)",
                    resi: `AMT2610130757-${randomSuffix}`,
                    waktu: "Selasa, 13/10/26 07:57",
                    berat: 6.5,
                    pekerjaan: selectedJob || "CUCI"
                };

                const updatedList = [dummyEntry, ...laundryData];
                saveLocalData(updatedList);
                await sendToGoogleSheet(dummyEntry);
                setSuccessMsg(`🧪 [SIMULASI BERHASIL] Data contoh "${dummyEntry.nama}" (${dummyEntry.berat} Kg - ${dummyEntry.pekerjaan}) berhasil masuk ke Tabel & dikirim ke Google Sheet!`);
            };

            // Fungsi Utama Membaca Gambar dengan Multi-Model Fallback
            const handleProcessImage = async () => {
                setErrorMsg("");
                setSuccessMsg("");
                setSyncStatus("");

                const cleanApiKey = geminiApiKey ? geminiApiKey.trim() : "";

                if (!cleanApiKey) {
                    setErrorMsg("⚠️ Kunci API (Gemini API Key) belum diisi! Silakan isi di menu Pengaturan di atas.");
                    setShowSettings(true);
                    window.scrollTo({ top: 0, behavior: "smooth" });
                    return;
                }
                if (!selectedImage) {
                    setErrorMsg("⚠️ Anda belum memilih/mengambil foto nota! Klik kotak kamera di atas terlebih dahulu.");
                    return;
                }
                if (!selectedJob) {
                    setErrorMsg("⚠️ Pilih salah satu jenis pekerjaan terlebih dahulu!");
                    return;
                }

                setIsProcessing(true);

                try {
                    const base64Data = selectedImage.split(",")[1];

                    const promptText = `Baca foto struk laundry ini. Ekstrak informasi berikut dan kembalikan HANYA format JSON murni tanpa backticks dan tanpa penjelasan tambahan:
{
  "nama": "Nama pelanggan (di dekat QR code atau bagian atas, contoh: Cynthia Kaliana (DLV) atau NUKI)",
  "resi": "Nomor nota/resi yang biasanya diawali huruf seperti AMT atau ITD (contoh: AMT261013075740990 atau ITD261013190138589)",
  "waktu": "Tanggal dan jam pada baris Terima (contoh: Selasa, 13/10/26 07:57)",
  "berat": "Angka berat dalam KG saja gunakan titik untuk desimal (contoh: 6.5 atau 16.8)"
}`;

                    // Mencoba berurutan dari model terbaru yang aktif di Google AI Studio saat ini
                    const modelsToTry = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"];
                    let result = null;
                    let successResponse = false;
                    let lastErrorMessage = "";

                    for (const modelName of modelsToTry) {
                        setProcessStep(`Membaca dengan AI (${modelName})...`);
                        try {
                            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${cleanApiKey}`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    contents: [{
                                        parts: [
                                            { text: promptText },
                                            { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                                        ]
                                    }]
                                })
                            });

                            const jsonRes = await response.json();
                            if (response.ok && jsonRes?.candidates?.[0]?.content?.parts?.[0]?.text) {
                                result = jsonRes;
                                successResponse = true;
                                break;
                            } else {
                                lastErrorMessage = jsonRes?.error?.message || `Error ${response.status}`;
                            }
                        } catch (fetchErr) {
                            lastErrorMessage = fetchErr.message;
                        }
                    }

                    if (!successResponse || !result) {
                        throw new Error(`Google AI menolak permintaan (${lastErrorMessage}). Periksa API Key Anda di Pengaturan.`);
                    }

                    setProcessStep("Mengurai data nota...");
                    let rawText = result.candidates[0].content.parts[0].text || "";

                    const firstBrace = rawText.indexOf("{");
                    const lastBrace = rawText.lastIndexOf("}");
                    if (firstBrace === -1 || lastBrace === -1) {
                        throw new Error("Teks pada nota tidak terbaca jelas. Coba foto ulang di tempat terang.");
                    }
                    const cleanJson = rawText.substring(firstBrace, lastBrace + 1);
                    const parsed = JSON.parse(cleanJson);

                    const cleanWeight = parseFloat(String(parsed.berat || "0").replace(",", ".").replace(/[^0-9.]/g, "")) || 0;
                    const cleanResi = String(parsed.resi || "-").trim();

                    if (isDuplicate(cleanResi)) {
                        setErrorMsg(`⚠️ Peringatan Duplikat: Nota "${cleanResi}" untuk pekerjaan "${selectedJob}" sudah pernah diinput!`);
                        setIsProcessing(false);
                        setProcessStep("");
                        return;
                    }

                    const newEntry = {
                        id: Date.now().toString(),
                        nama: String(parsed.nama || "-").trim(),
                        resi: cleanResi,
                        waktu: String(parsed.waktu || "-").trim(),
                        berat: cleanWeight,
                        pekerjaan: selectedJob
                    };

                    const updatedList = [newEntry, ...laundryData];
                    saveLocalData(updatedList);

                    setProcessStep("Menyimpan ke Google Sheet...");
                    await sendToGoogleSheet(newEntry);

                    setSuccessMsg(`✅ Berhasil! Pelanggan: ${newEntry.nama} | Nota: ${newEntry.resi} | Berat: ${newEntry.berat} Kg (${newEntry.pekerjaan})`);
                    setSelectedImage(null);
                } catch (err) {
                    console.error(err);
                    setErrorMsg("❌ Gagal: " + err.message);
                } finally {
                    setIsProcessing(false);
                    setProcessStep("");
                }
            };

            const totals = JOB_LIST.reduce((acc, job) => {
                acc[job] = laundryData
                    .filter(item => item.pekerjaan === job)
                    .reduce((sum, item) => sum + (parseFloat(item.berat) || 0), 0);
                return acc;
            }, {});

            const saveEditedWeight = (id) => {
                const num = parseFloat(String(editValue).replace(",", "."));
                if (isNaN(num) || num < 0) {
                    alert("Masukkan angka KG yang benar!");
                    return;
                }
                const updated = laundryData.map(item => item.id === id ? { ...item, berat: num } : item);
                saveLocalData(updated);
                setEditingId(null);
                setSuccessMsg("✅ Data berat (KG) berhasil diperbarui!");
            };

            const downloadBothJPEGs = () => {
                if (laundryData.length === 0) {
                    alert("Belum ada data untuk disimpan!");
                    return;
                }
                generateSummaryCardJPEG();
                setTimeout(() => {
                    generateOfficialFormJPEG();
                }, 600);
            };

            const generateSummaryCardJPEG = () => {
                const canvas = document.createElement("canvas");
                const rowCount = laundryData.length;
                canvas.width = 800;
                canvas.height = Math.max(650, 420 + rowCount * 42);
                const ctx = canvas.getContext("2d");

                ctx.fillStyle = "#F8FAFC";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#1D4ED8";
                ctx.fillRect(0, 0, canvas.width, 110);
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 28px sans-serif";
                ctx.fillText("REKAP DATA KERJA HARIAN LAUNDRY", 35, 50);
                ctx.font = "16px sans-serif";
                ctx.fillText(`Karyawan: ${employeeName || "-"}   |   Tanggal: ${new Date().toLocaleDateString("id-ID")}`, 35, 85);

                let xBox = 35;
                JOB_LIST.forEach((job) => {
                    ctx.fillStyle = "#FFFFFF";
                    ctx.strokeStyle = "#CBD5E1";
                    ctx.lineWidth = 1.5;
                    ctx.fillRect(xBox, 130, 115, 75);
                    ctx.strokeRect(xBox, 130, 115, 75);

                    ctx.fillStyle = "#64748B";
                    ctx.font = "bold 11px sans-serif";
                    ctx.fillText(job, xBox + 12, 155);

                    ctx.fillStyle = "#1D4ED8";
                    ctx.font = "bold 20px sans-serif";
                    ctx.fillText(`${totals[job].toFixed(1)} Kg`, xBox + 12, 185);
                    xBox += 123;
                });

                let y = 240;
                ctx.fillStyle = "#1E293B";
                ctx.fillRect(35, y, 730, 38);
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 13px sans-serif";
                ctx.fillText("NO", 50, y + 24);
                ctx.fillText("NAMA PELANGGAN", 95, y + 24);
                ctx.fillText("NO. NOTA", 310, y + 24);
                ctx.fillText("PEKERJAAN", 520, y + 24);
                ctx.fillText("BERAT (KG)", 660, y + 24);

                y += 38;
                laundryData.forEach((item, index) => {
                    ctx.fillStyle = index % 2 === 0 ? "#FFFFFF" : "#F1F5F9";
                    ctx.fillRect(35, y, 730, 38);
                    ctx.strokeStyle = "#E2E8F0";
                    ctx.strokeRect(35, y, 730, 38);

                    ctx.fillStyle = "#0F172A";
                    ctx.font = "13px sans-serif";
                    ctx.fillText(String(index + 1), 50, y + 24);
                    ctx.fillText(item.nama.substring(0, 24), 95, y + 24);
                    ctx.fillText(item.resi.substring(0, 22), 310, y + 24);
                    ctx.font = "bold 12px sans-serif";
                    ctx.fillStyle = "#1D4ED8";
                    ctx.fillText(item.pekerjaan, 520, y + 24);
                    ctx.fillStyle = "#0F172A";
                    ctx.font = "bold 14px sans-serif";
                    ctx.fillText(`${Number(item.berat).toFixed(1)} Kg`, 660, y + 24);
                    y += 38;
                });

                const link = document.createElement("a");
                link.download = `1_Data_Rekap_${employeeName || "Laundry"}_${new Date().toISOString().slice(0,10)}.jpg`;
                link.href = canvas.toDataURL("image/jpeg", 0.95);
                link.click();
            };

            const generateOfficialFormJPEG = () => {
                const canvas = document.createElement("canvas");
                canvas.width = 1240;
                canvas.height = 1750;
                const ctx = canvas.getContext("2d");

                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = "#1E3A8A";
                ctx.lineWidth = 2.5;
                ctx.strokeRect(60, 50, 1120, 75);

                ctx.fillStyle = "#0F296B";
                ctx.font = "bold 36px Arial";
                ctx.textAlign = "center";
                ctx.fillText("FORMULIR KERJA HARIAN", canvas.width / 2, 100);

                ctx.textAlign = "left";
                ctx.font = "bold 16px Arial";
                ctx.fillStyle = "#0F296B";
                ctx.fillText("NAMA KARYAWAN  :", 60, 165);
                ctx.fillText("HARI / TANGGAL    :", 620, 165);

                ctx.strokeStyle = "#64748B";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(230, 168); ctx.lineTo(480, 168);
                ctx.moveTo(790, 168); ctx.lineTo(1080, 168);
                ctx.stroke();

                ctx.font = "bold 18px Arial";
                ctx.fillStyle = "#000000";
                ctx.fillText(employeeName || "-", 235, 163);
                const tglStr = new Date().toLocaleDateString("id-ID", { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
                ctx.fillText(tglStr, 795, 163);

                ctx.font = "bold 16px Arial";
                ctx.fillStyle = "#0F296B";
                ctx.fillText("TOTAL KILOAN", 60, 210);
                ctx.beginPath(); ctx.moveTo(60, 214); ctx.lineTo(185, 214); ctx.stroke();

                ctx.fillText("TOTAL SATUAN", 620, 210);
                ctx.beginPath(); ctx.moveTo(620, 214); ctx.lineTo(750, 214); ctx.stroke();

                const kiloanItems = [
                    { label: "CUCI", val: totals["CUCI"] },
                    { label: "KERING", val: totals["DRY"] },
                    { label: "SETRIKA", val: totals["SETRIKA"] },
                    { label: "LIPAT", val: totals["LIPAT"] },
                    { label: "PACKING", val: totals["PACKING"] }
                ];

                let yPos = 242;
                kiloanItems.forEach(item => {
                    ctx.font = "15px Arial";
                    ctx.fillStyle = "#0F296B";
                    ctx.fillText(item.label, 60, yPos);
                    ctx.fillText(":", 195, yPos);
                    ctx.beginPath(); ctx.moveTo(205, yPos + 3); ctx.lineTo(295, yPos + 3); ctx.stroke();
                    ctx.font = "bold 16px Arial";
                    ctx.fillStyle = "#000000";
                    ctx.fillText(item.val > 0 ? item.val.toFixed(1) : "-", 230, yPos - 1);
                    ctx.font = "15px Arial";
                    ctx.fillStyle = "#0F296B";
                    ctx.fillText("Kg", 305, yPos);
                    yPos += 30;
                });

                const satuanItems = [
                    { label: "SEPATU", val: 0 },
                    { label: "BED COVER", val: 0 },
                    { label: "SET SPREI", val: 0 },
                    { label: "CUCI SATUAN", val: totals["CUCI SATUAN"] },
                    { label: "LAINNYA", val: 0 }
                ];

                yPos = 242;
                satuanItems.forEach(item => {
                    ctx.font = "15px Arial";
                    ctx.fillStyle = "#0F296B";
                    ctx.fillText(item.label, 620, yPos);
                    ctx.fillText(":", 765, yPos);
                    ctx.beginPath(); ctx.moveTo(775, yPos + 3); ctx.lineTo(865, yPos + 3); ctx.stroke();
                    ctx.font = "bold 16px Arial";
                    ctx.fillStyle = "#000000";
                    ctx.fillText(item.val > 0 ? item.val.toFixed(1) : "-", 805, yPos - 1);
                    ctx.font = "15px Arial";
                    ctx.fillStyle = "#0F296B";
                    ctx.fillText("Pcs/Kg", 875, yPos);
                    yPos += 30;
                });

                const tableTop = 415;
                const headerH = 54;
                const rowH = 38;
                const colX = [60, 105, 355, 525, 655, 720, 785, 850, 915, 980, 1085, 1180];

                ctx.fillStyle = "#E2E8F0";
                ctx.fillRect(60, tableTop, 1120, headerH);
                ctx.strokeStyle = "#1E3A8A";
                ctx.lineWidth = 1.8;
                ctx.strokeRect(60, tableTop, 1120, headerH);

                ctx.beginPath();
                ctx.moveTo(655, tableTop + 27);
                ctx.lineTo(980, tableTop + 27);
                ctx.stroke();

                ctx.fillStyle = "#0F296B";
                ctx.font = "bold 13px Arial";
                ctx.textAlign = "center";
                ctx.fillText("NO", 82.5, tableTop + 32);
                ctx.fillText("NAMA PELANGGAN", 230, tableTop + 32);
                ctx.fillText("NO. NOTA", 440, tableTop + 32);
                ctx.fillText("WAKTU (WIB)", 590, tableTop + 32);
                ctx.fillText("PROSES KERJA (Kg)", 817.5, tableTop + 19);
                ctx.fillText("KETERANGAN", 1032.5, tableTop + 32);
                ctx.fillText("SATUAN", 1132.5, tableTop + 32);

                ctx.font = "bold 11px Arial";
                ctx.fillText("CUCI", 687.5, tableTop + 45);
                ctx.fillText("KERING", 752.5, tableTop + 45);
                ctx.fillText("SETRIKA", 817.5, tableTop + 45);
                ctx.fillText("LIPAT", 882.5, tableTop + 45);
                ctx.fillText("PACKING", 947.5, tableTop + 45);

                const chronologicalData = [...laundryData].reverse();

                for (let i = 0; i < 30; i++) {
                    const rY = tableTop + headerH + (i * rowH);
                    ctx.fillStyle = (i % 2 === 0) ? "#CBD5E1" : "#FFFFFF";
                    ctx.fillRect(60, rY, 1120, rowH);

                    ctx.strokeStyle = "#475569";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(60, rY, 1120, rowH);

                    ctx.fillStyle = "#0F296B";
                    ctx.font = "bold 12px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(String(i + 1), 82.5, rY + 24);

                    const item = chronologicalData[i];
                    if (item) {
                        ctx.fillStyle = "#000000";
                        ctx.font = "bold 13px Arial";
                        ctx.textAlign = "left";
                        ctx.fillText(item.nama.substring(0, 25), 112, rY + 24);

                        ctx.font = "12px Arial";
                        ctx.textAlign = "center";
                        ctx.fillText(item.resi.substring(0, 20), 440, rY + 24);

                        const shortTime = item.waktu.replace(/^[A-Za-z]+,\s*/, "").substring(0, 16);
                        ctx.fillText(shortTime, 590, rY + 24);

                        ctx.font = "bold 14px Arial";
                        const kgText = Number(item.berat).toFixed(1);
                        if (item.pekerjaan === "CUCI") ctx.fillText(kgText, 687.5, rY + 24);
                        if (item.pekerjaan === "DRY") ctx.fillText(kgText, 752.5, rY + 24);
                        if (item.pekerjaan === "SETRIKA") ctx.fillText(kgText, 817.5, rY + 24);
                        if (item.pekerjaan === "LIPAT") ctx.fillText(kgText, 882.5, rY + 24);
                        if (item.pekerjaan === "PACKING") ctx.fillText(kgText, 947.5, rY + 24);
                        if (item.pekerjaan === "CUCI SATUAN") {
                            ctx.fillText(kgText, 1132.5, rY + 24);
                            ctx.font = "11px Arial";
                            ctx.fillText("Cuci Satuan", 1032.5, rY + 24);
                        }
                    }
                }

                const tableBottom = tableTop + headerH + (30 * rowH);
                ctx.strokeStyle = "#1E3A8A";
                ctx.lineWidth = 1.4;
                colX.forEach((x, idx) => {
                    ctx.beginPath();
                    const startY = (idx >= 5 && idx <= 8) ? tableTop + 27 : tableTop;
                    ctx.moveTo(x, startY);
                    ctx.lineTo(x, tableBottom);
                    ctx.stroke();
                });

                ctx.fillStyle = "#0F296B";
                ctx.font = "bold 13px Arial";
                ctx.textAlign = "right";
                ctx.fillText("LEMBAR KE :  1", 1175, tableBottom + 35);

                const link = document.createElement("a");
                link.download = `2_Formulir_Kerja_Harian_${employeeName || "Laundry"}_${new Date().toISOString().slice(0,10)}.jpg`;
                link.href = canvas.toDataURL("image/jpeg", 0.95);
                link.click();
            };

            return (
                <div class="max-w-lg mx-auto px-4 pt-5">
                    {/* Header App */}
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 rounded-xl bg-blue-600 text-white flex items-center justify-center font-extrabold text-lg shadow-sm">
                                FS
                            </div>
                            <div>
                                <h1 class="font-extrabold text-slate-800 text-base leading-tight">Fresh Story Laundry</h1>
                                <div class="flex items-center gap-1.5 mt-0.5">
                                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <span class="text-xs text-slate-500 font-medium">Sistem v2.5 Aktif</span>
                                </div>
                            </div>
                        </div>
                        <button 
                            type="button"
                            onClick={() => { setShowSettings(!showSettings); setIsAdminUnlocked(false); }}
                            class={`px-3 py-2 rounded-xl border text-xs font-bold transition flex items-center gap-1.5 ${showSettings ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-200'}`}
                        >
                            ⚙️ Pengaturan
                        </button>
                    </div>

                    {/* Menu Pengaturan */}
                    {showSettings && (
                        <div class="bg-blue-50 border border-blue-200 rounded-2xl p-4 mb-4 shadow-md space-y-4">
                            <div class="flex items-center justify-between border-b border-blue-200 pb-2">
                                <h3 class="font-extrabold text-blue-900 text-xs uppercase">
                                    🔑 Pengaturan Kunci AI & Admin
                                </h3>
                                <button type="button" onClick={() => { setShowSettings(false); setIsAdminUnlocked(false); }} class="text-blue-700 hover:text-blue-900 text-xs font-extrabold">
                                    Tutup [X]
                                </button>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-blue-900 mb-1 flex justify-between items-center">
                                    <span>Gemini API Key Anda:</span>
                                    {!geminiApiKey ? (
                                        <span class="text-red-600 font-extrabold">Wajib Diisi ⚠️</span>
                                    ) : (
                                        <span class="text-emerald-700 font-extrabold">Sudah Terisi ✓</span>
                                    )}
                                </label>
                                <div class="flex gap-2">
                                    <input 
                                        type="text"
                                        value={geminiApiKey}
                                        onChange={(e) => {
                                            const cleanVal = e.target.value.trim();
                                            setGeminiApiKey(cleanVal);
                                            localStorage.setItem("fsl_gemini_api_key", cleanVal);
                                            setKeyTestResult(null);
                                        }}
                                        placeholder="Tempel kode AIzaSy... di sini"
                                        class="flex-1 px-3 py-2 bg-white border border-blue-300 rounded-xl font-mono text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800"
                                    />
                                    <button
                                        type="button"
                                        onClick={handleTestApiKey}
                                        disabled={isTestingKey}
                                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap"
                                    >
                                        {isTestingKey ? "Mengetes..." : "⚡ Test Key"}
                                    </button>
                                </div>
                                {keyTestResult && (
                                    <div class={`mt-2 p-2 rounded-lg text-xs font-bold ${keyTestResult.ok ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700'}`}>
                                        {keyTestResult.msg}
                                    </div>
                                )}
                                <p class="text-[11px] text-blue-800 mt-1">
                                    Dapatkan gratis di <a href="https://aistudio.google.com/app/apikey" target="_blank" class="underline font-bold">aistudio.google.com</a>.
                                </p>
                            </div>

                            <hr class="border-blue-200" />

                            {/* Akses Admin */}
                            {!isAdminUnlocked ? (
                                <form onSubmit={handleAdminLogin} class="space-y-2">
                                    <label class="block text-xs font-bold text-slate-700">🔒 Pengaturan URL Sheet (Khusus Admin):</label>
                                    <div class="flex gap-2">
                                        <input 
                                            type="password"
                                            value={adminPasswordInput}
                                            onChange={(e) => setAdminPasswordInput(e.target.value)}
                                            placeholder="Masukkan PIN Admin (Default: 1234)"
                                            class="flex-1 px-3 py-2 text-xs bg-white border border-blue-300 rounded-xl focus:outline-none text-slate-800 font-bold"
                                        />
                                        <button 
                                            type="submit"
                                            class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-2 rounded-xl"
                                        >
                                            Buka
                                        </button>
                                    </div>
                                </form>
                            ) : (
                                <div class="bg-white border border-blue-200 rounded-xl p-3 space-y-3">
                                    <div class="flex justify-between items-center">
                                        <span class="text-xs font-bold text-emerald-600">🔓 Panel Admin Terbuka</span>
                                        <button type="button" onClick={() => setIsAdminUnlocked(false)} class="text-xs text-red-500 font-bold underline">Kunci</button>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-blue-900 mb-1">
                                            Link Google Sheet (Apps Script):
                                        </label>
                                        <input 
                                            type="text"
                                            value={scriptUrl}
                                            onChange={(e) => {
                                                setScriptUrl(e.target.value.trim());
                                                localStorage.setItem("fsl_script_url", e.target.value.trim());
                                            }}
                                            placeholder="https://script.google.com/macros/s/..../exec"
                                            class="w-full px-3 py-2 text-[11px] bg-slate-50 border border-blue-300 rounded-xl text-slate-700"
                                        />
                                    </div>

                                    <div class="border-t border-slate-100 pt-2">
                                        {!isChangingPass ? (
                                            <button 
                                                type="button"
                                                onClick={() => setIsChangingPass(true)} 
                                                class="text-xs text-blue-600 font-semibold underline"
                                            >
                                                Ubah PIN Admin
                                            </button>
                                        ) : (
                                            <form onSubmit={handleSaveNewPassword} class="flex gap-2">
                                                <input 
                                                    type="password" 
                                                    value={newAdminPassword}
                                                    onChange={(e) => setNewAdminPassword(e.target.value)}
                                                    placeholder="PIN baru..."
                                                    class="flex-1 px-3 py-1 text-xs border rounded-lg text-slate-800"
                                                />
                                                <button type="submit" class="bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-lg">
                                                    Simpan
                                                </button>
                                            </form>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Input Nama Karyawan */}
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-4">
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                            Nama Karyawan Bertugas:
                        </label>
                        <input 
                            type="text"
                            value={employeeName}
                            onChange={(e) => {
                                setEmployeeName(e.target.value);
                                localStorage.setItem("fsl_employee", e.target.value);
                            }}
                            placeholder="Ketik nama Anda di sini..."
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                    </div>

                    {/* Kotak Upload Foto */}
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-4">
                        {!selectedImage ? (
                            <label class="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer bg-slate-50 transition">
                                <input type="file" accept="image/*" onChange={handleImageUpload} class="hidden" />
                                <div class="w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mb-3 text-2xl">
                                    📷
                                </div>
                                <span class="font-bold text-slate-700 text-sm">Ambil Foto / Pilih Gambar Nota</span>
                                <span class="text-xs text-slate-400 mt-1">Otomatis dikompres & siap dibaca AI</span>
                            </label>
                        ) : (
                            <div class="relative rounded-xl overflow-hidden bg-slate-900 max-h-80 flex justify-center">
                                <img src={selectedImage} alt="Nota" class="max-h-80 object-contain" />
                                <button 
                                    type="button"
                                    onClick={() => setSelectedImage(null)}
                                    class="absolute top-3 right-3 bg-red-600 text-white px-3 py-1.5 rounded-full text-xs font-bold shadow hover:bg-red-700"
                                >
                                    ✕ Ganti Foto
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Kategori Pekerjaan */}
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-4">
                        <p class="font-bold text-slate-800 text-xs mb-3">Pilih Pekerjaan (1 Foto = 1 Pekerjaan):</p>
                        <div class="flex flex-wrap gap-2">
                            {JOB_LIST.map((job) => {
                                const active = selectedJob === job;
                                return (
                                    <button
                                        key={job}
                                        type="button"
                                        onClick={() => setSelectedJob(job)}
                                        class={`px-3 py-2 rounded-xl border text-xs font-bold flex items-center gap-2 transition ${
                                            active 
                                            ? "border-blue-600 bg-blue-50 text-blue-700 shadow-sm" 
                                            : "border-slate-200 bg-white text-slate-700 hover:bg-slate-50"
                                        }`}
                                    >
                                        <span class={`w-4 h-4 rounded flex items-center justify-center border ${
                                            active ? "bg-blue-600 border-blue-600 text-white text-[10px]" : "border-slate-400"
                                        }`}>
                                            {active ? "✓" : ""}
                                        </span>
                                        {job}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Pesan Error / Sukses */}
                    {errorMsg && (
                        <div class="bg-red-50 border-2 border-red-300 text-red-700 px-4 py-3.5 rounded-2xl mb-4 text-xs font-bold shadow-sm">
                            {errorMsg}
                        </div>
                    )}

                    {successMsg && (
                        <div class="bg-emerald-50 border-2 border-emerald-300 text-emerald-800 px-4 py-3.5 rounded-2xl mb-4 text-xs font-bold shadow-sm">
                            <p>{successMsg}</p>
                            {syncStatus === "syncing" && <p class="text-[11px] text-emerald-600 mt-1">⏳ Sedang mengirim ke Google Sheet...</p>}
                            {syncStatus === "synced" && <p class="text-[11px] text-emerald-700 mt-1">✓ Tersimpan di Google Sheet!</p>}
                            {syncStatus === "failed" && <p class="text-[11px] text-orange-600 mt-1">⚠️ Tersimpan di HP, namun gagal masuk ke Google Sheet.</p>}
                        </div>
                    )}

                    {/* Tombol Eksekusi Utama */}
                    <button
                        type="button"
                        onClick={handleProcessImage}
                        disabled={isProcessing}
                        class="w-full py-4 rounded-2xl bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-extrabold text-base shadow-lg transition disabled:opacity-60 flex items-center justify-center gap-2 mb-3"
                    >
                        {isProcessing ? (
                            <>
                                <span class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                                <span>{processStep || "Memproses..."}</span>
                            </>
                        ) : (
                            <span>🔍 Baca Data dari Gambar</span>
                        )}
                    </button>

                    {/* Tombol Simulasi Test */}
                    <button
                        type="button"
                        onClick={handleRunSimulation}
                        class="w-full py-2.5 rounded-xl bg-amber-100 hover:bg-amber-200 border border-amber-300 text-amber-900 font-bold text-xs transition flex items-center justify-center gap-1.5 mb-6"
                    >
                        🧪 Test Simulasi Nota (Cek Tabel, Form JPEG & Sheet Tanpa Foto)
                    </button>

                    {/* Panel Rekap */}
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-4">
                        <div class="flex items-center justify-between mb-3">
                            <h2 class="font-extrabold text-slate-800 text-xs">📊 Total Kiloan Harian</h2>
                            <button
                                type="button"
                                onClick={downloadBothJPEGs}
                                class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-[11px] font-bold shadow transition"
                            >
                                📥 Simpan 2 JPEG (Data & Form)
                            </button>
                        </div>

                        <div class="grid grid-cols-3 gap-2">
                            {JOB_LIST.map(job => (
                                <div key={job} class="bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-center">
                                    <span class="block text-[10px] font-bold text-slate-500">{job}</span>
                                    <span class="block text-base font-extrabold text-blue-700 mt-0.5">
                                        {totals[job].toFixed(1)} <span class="text-xs font-normal text-slate-500">Kg</span>
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Daftar Hasil */}
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                            <h2 class="font-extrabold text-slate-800 text-xs">
                                📋 Daftar Nota ({laundryData.length})
                            </h2>
                            {laundryData.length > 0 && (
                                <button 
                                    type="button"
                                    onClick={() => { if (confirm("Hapus seluruh daftar di HP Anda?")) saveLocalData([]); }}
                                    class="text-xs font-bold text-red-500 hover:text-red-700"
                                >
                                    Reset
                                </button>
                            )}
                        </div>

                        {laundryData.length === 0 ? (
                            <div class="p-8 text-center text-slate-400 text-xs font-medium">
                                Belum ada nota yang diproses hari ini.
                            </div>
                        ) : (
                            <div class="divide-y divide-slate-100">
                                {laundryData.map((item, idx) => (
                                    <div key={item.id} class="p-4 flex items-center justify-between gap-3 hover:bg-slate-50">
                                        <div class="min-w-0 flex-1">
                                            <div class="flex items-center gap-2">
                                                <span class="text-xs font-bold text-slate-400">#{laundryData.length - idx}</span>
                                                <p class="font-bold text-slate-800 text-sm truncate">{item.nama}</p>
                                            </div>
                                            <p class="text-xs font-mono text-slate-500 mt-0.5">{item.resi}</p>
                                            <p class="text-[11px] text-slate-400">{item.waktu}</p>
                                        </div>

                                        <div class="text-right flex flex-col items-end gap-1">
                                            <span class="px-2 py-0.5 bg-blue-50 text-blue-700 border border-blue-200 rounded-full text-[10px] font-extrabold">
                                                {item.pekerjaan}
                                            </span>

                                            {editingId === item.id ? (
                                                <div class="flex items-center gap-1 mt-1">
                                                    <input 
                                                        type="number" 
                                                        step="0.1"
                                                        value={editValue}
                                                        onChange={(e) => setEditValue(e.target.value)}
                                                        class="w-16 px-1.5 py-0.5 text-xs border border-blue-400 rounded-lg font-bold text-right"
                                                    />
                                                    <button 
                                                        type="button"
                                                        onClick={() => saveEditedWeight(item.id)}
                                                        class="bg-emerald-600 text-white px-2 py-0.5 rounded-lg text-[10px] font-bold"
                                                    >
                                                        OK
                                                    </button>
                                                </div>
                                            ) : (
                                                <div class="flex items-center gap-2 mt-1 text-xs">
                                                    <span class="font-extrabold text-slate-800">{Number(item.berat).toFixed(1)} Kg</span>
                                                    <button 
                                                        type="button"
                                                        onClick={() => { setEditingId(item.id); setEditValue(item.berat); }}
                                                        class="text-blue-600 underline font-semibold"
                                                    >
                                                        Edit
                                                    </button>
                                                    <button 
                                                        type="button"
                                                        onClick={() => saveLocalData(laundryData.filter(d => d.id !== item.id))}
                                                        class="text-red-500 font-semibold ml-1"
                                                    >
                                                        Hapus
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>

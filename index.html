<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kerja Harian Laundry</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-16">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // URL default dari link Google Sheet yang Anda berikan
        const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwh7fvvRoUDxQADb42ktIkrWqJSHAn_afwH1Pa5nVWW4ajn9tcZsSeI8GuKOS9gW70B4A/exec";
        const JOB_LIST = ["CUCI", "DRY", "LIPAT", "SETRIKA", "PACKING", "CUCI SATUAN"];

        function App() {
            const [selectedImage, setSelectedImage] = useState(null);
            const [selectedJob, setSelectedJob] = useState("DRY");
            const [employeeName, setEmployeeName] = useState("");
            const [scriptUrl, setScriptUrl] = useState(DEFAULT_SCRIPT_URL);
            
            // API Key dan Pengaturan Admin
            const [geminiApiKey, setGeminiApiKey] = useState(""); 
            const [showSettings, setShowSettings] = useState(false);
            const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
            const [adminPasswordInput, setAdminPasswordInput] = useState("");
            const [adminPassword, setAdminPassword] = useState("1234"); // Default kata sandi Admin
            const [newAdminPassword, setNewAdminPassword] = useState("");
            const [isChangingPass, setIsChangingPass] = useState(false);

            const [isProcessing, setIsProcessing] = useState(false);
            const [syncStatus, setSyncStatus] = useState(""); // "", "syncing", "synced", "failed"
            const [errorMsg, setErrorMsg] = useState("");
            const [successMsg, setSuccessMsg] = useState("");
            
            const [laundryData, setLaundryData] = useState([]);
            const [editingId, setEditingId] = useState(null);
            const [editValue, setEditValue] = useState("");

            // Membaca data tersimpan di memori browser HP karyawan
            useEffect(() => {
                const savedData = localStorage.getItem("fsl_records_v2");
                if (savedData) {
                    try { setLaundryData(JSON.parse(savedData)); } catch (e) { setLaundryData([]); }
                }
                const savedEmp = localStorage.getItem("fsl_employee");
                if (savedEmp) setEmployeeName(savedEmp);

                const savedUrl = localStorage.getItem("fsl_script_url");
                if (savedUrl) setScriptUrl(savedUrl);

                // Mengambil API Key yang diinput mandiri oleh karyawan tersebut di HP-nya
                const savedApiKey = localStorage.getItem("fsl_gemini_api_key");
                if (savedApiKey) {
                    setGeminiApiKey(savedApiKey);
                } else {
                    // Jika belum ada, otomatis buka Pengaturan agar mereka sadar harus mengisi
                    setShowSettings(true);
                }

                // Ambil password admin yang kustom jika ada
                const savedPass = localStorage.getItem("fsl_admin_pass");
                if (savedPass) setAdminPassword(savedPass);
            }, []);

            // Buat ikon Lucide
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const saveLocalData = (newData) => {
                setLaundryData(newData);
                localStorage.setItem("fsl_records_v2", JSON.stringify(newData));
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setSelectedImage(reader.result);
                        setErrorMsg("");
                        setSuccessMsg("");
                    };
                    reader.readAsDataURL(file);
                }
            };

            const isDuplicate = (resi) => {
                if (!resi || resi === "-") return false;
                return laundryData.some(item => 
                    item.resi.toLowerCase().trim() === resi.toLowerCase().trim() &&
                    item.pekerjaan === selectedJob
                );
            };

            // Login Admin
            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPasswordInput === adminPassword) {
                    setIsAdminUnlocked(true);
                    setErrorMsg("");
                    setAdminPasswordInput("");
                } else {
                    alert("Kata Sandi Admin Salah!");
                    setAdminPasswordInput("");
                }
            };

            // Mengganti Password Admin
            const handleSaveNewPassword = (e) => {
                e.preventDefault();
                if (!newAdminPassword.trim()) return;
                setAdminPassword(newAdminPassword);
                localStorage.setItem("fsl_admin_pass", newAdminPassword);
                setNewAdminPassword("");
                setIsChangingPass(false);
                alert("Kata Sandi Admin berhasil diubah!");
            };

            // Mengirim data ke Google Sheet
            const sendToGoogleSheet = async (rowItem) => {
                if (!scriptUrl) return;
                setSyncStatus("syncing");
                try {
                    await fetch(scriptUrl, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            tanggalInput: new Date().toLocaleString("id-ID"),
                            namaKaryawan: employeeName || "-",
                            namaPelanggan: rowItem.nama,
                            noNota: rowItem.resi,
                            waktu: rowItem.waktu,
                            pekerjaan: rowItem.pekerjaan,
                            berat: rowItem.berat
                        })
                    });
                    setSyncStatus("synced");
                } catch (error) {
                    console.error("Gagal sinkronisasi ke Sheet:", error);
                    setSyncStatus("failed");
                }
            };

            // Fungsi Membaca Gambar dengan Kecerdasan Buatan (AI)
            const handleProcessImage = async () => {
                if (!geminiApiKey || geminiApiKey.trim() === "") {
                    setErrorMsg("ERROR: Kunci API (Gemini API Key) Anda kosong! Silakan klik tombol 'Gerigi' di kanan atas dan masukkan API Key Anda terlebih dahulu.");
                    setShowSettings(true);
                    return;
                }
                if (!selectedImage) {
                    setErrorMsg("Harap ambil atau pilih foto nota terlebih dahulu!");
                    return;
                }
                if (!selectedJob) {
                    setErrorMsg("Pilih 1 jenis pekerjaan terlebih dahulu!");
                    return;
                }

                setIsProcessing(true);
                setErrorMsg("");
                setSuccessMsg("");
                setSyncStatus("");

                try {
                    const base64Data = selectedImage.split(",")[1];
                    const mimeType = selectedImage.substring(selectedImage.indexOf(":") + 1, selectedImage.indexOf(";"));

                    const promptText = `Baca foto struk laundry ini. Ekstrak informasi berikut dan kembalikan HANYA format JSON murni tanpa backticks, tanpa kata pengantar apa pun:
{
  "nama": "Nama pelanggan (cari yang dekat QR code atau bagian atas, contoh: Cynthia Kaliana (DLV) atau NUKI)",
  "resi": "Nomor nota/resi yang biasanya diawali huruf seperti AMT atau ITD (contoh: AMT261013075740990 atau ITD261013190138589)",
  "waktu": "Tanggal dan jam pada baris Terima (contoh: Selasa, 13/10/26 07:57)",
  "berat": "Angka berat dalam KG saja gunakan titik untuk desimal (contoh: 6.5 atau 16.8)"
}`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: promptText },
                                    { inlineData: { mimeType: mimeType, data: base64Data } }
                                ]
                            }]
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Kunci API salah atau tidak diizinkan oleh Google (Status ${response.status}). Mohon periksa kembali inputan Gemini API Key Anda.`);
                    }

                    const result = await response.json();
                    let rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text || "";

                    const firstBrace = rawText.indexOf("{");
                    const lastBrace = rawText.lastIndexOf("}");
                    if (firstBrace === -1 || lastBrace === -1) {
                        throw new Error("Gagal membaca tulisan pada foto. Silakan coba foto ulang dengan pencahayaan yang lebih terang.");
                    }
                    const cleanJson = rawText.substring(firstBrace, lastBrace + 1);
                    const parsed = JSON.parse(cleanJson);

                    const cleanWeight = parseFloat(String(parsed.berat || "0").replace(",", ".").replace(/[^0-9.]/g, "")) || 0;
                    const cleanResi = String(parsed.resi || "-").trim();

                    if (isDuplicate(cleanResi)) {
                        setErrorMsg(`Peringatan: Nota "${cleanResi}" untuk pekerjaan "${selectedJob}" sudah pernah diinput sebelumnya.`);
                        setIsProcessing(false);
                        return;
                    }

                    const newEntry = {
                        id: Date.now().toString(),
                        nama: String(parsed.nama || "-").trim(),
                        resi: cleanResi,
                        waktu: String(parsed.waktu || "-").trim(),
                        berat: cleanWeight,
                        pekerjaan: selectedJob
                    };

                    const updatedList = [newEntry, ...laundryData];
                    saveLocalData(updatedList);

                    // Kirim ke Google Sheets secara otomatis (Latar Belakang)
                    sendToGoogleSheet(newEntry);

                    setSuccessMsg(`Berhasil mencatat nota ${newEntry.nama} (${newEntry.berat} Kg - ${newEntry.pekerjaan})`);
                    setSelectedImage(null);
                } catch (err) {
                    console.error(err);
                    setErrorMsg("Gagal membaca foto: " + err.message);
                } finally {
                    setIsProcessing(false);
                }
            };

            const totals = JOB_LIST.reduce((acc, job) => {
                acc[job] = laundryData
                    .filter(item => item.pekerjaan === job)
                    .reduce((sum, item) => sum + (parseFloat(item.berat) || 0), 0);
                return acc;
            }, {});

            const saveEditedWeight = (id) => {
                const num = parseFloat(String(editValue).replace(",", "."));
                if (isNaN(num) || num < 0) {
                    alert("Masukkan angka KG yang benar!");
                    return;
                }
                const updated = laundryData.map(item => item.id === id ? { ...item, berat: num } : item);
                saveLocalData(updated);
                setEditingId(null);
                setSuccessMsg("Data berat (KG) berhasil diperbarui!");
            };

            const downloadBothJPEGs = () => {
                if (laundryData.length === 0) {
                    alert("Belum ada data untuk disimpan!");
                    return;
                }
                generateSummaryCardJPEG();
                setTimeout(() => {
                    generateOfficialFormJPEG();
                }, 600);
            };

            const generateSummaryCardJPEG = () => {
                const canvas = document.createElement("canvas");
                const rowCount = laundryData.length;
                canvas.width = 800;
                canvas.height = Math.max(650, 420 + rowCount * 42);
                const ctx = canvas.getContext("2d");

                ctx.fillStyle = "#F8FAFC";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#1D4ED8";
                ctx.fillRect(0, 0, canvas.width, 110);
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 28px sans-serif";
                ctx.fillText("REKAP DATA KERJA HARIAN LAUNDRY", 35, 50);
                ctx.font = "16px sans-serif";
                ctx.fillText(`Karyawan: ${employeeName || "-"}   |   Tanggal: ${new Date().toLocaleDateString("id-ID")}`, 35, 85);

                let xBox = 35;
                JOB_LIST.forEach((job) => {
                    ctx.fillStyle = "#FFFFFF";
                    ctx.strokeStyle = "#CBD5E1";
                    ctx.lineWidth = 1.5;
                    ctx.fillRect(xBox, 130, 115, 75);
                    ctx.strokeRect(xBox, 130, 115, 75);

                    ctx.fillStyle = "#64748B";
                    ctx.font = "bold 11px sans-serif";
                    ctx.fillText(job, xBox + 12, 155);

                    ctx.fillStyle = "#1D4ED8";
                    ctx.font = "bold 20px sans-serif";
                    ctx.fillText(`${totals[job].toFixed(1)} Kg`, xBox + 12, 185);
                    xBox += 123;
                });

                let y = 240;
                ctx.fillStyle = "#1E293B";
                ctx.fillRect(35, y, 730, 38);
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 13px sans-serif";
                ctx.fillText("NO", 50, y + 24);
                ctx.fillText("NAMA PELANGGAN", 95, y + 24);
                ctx.fillText("NO. NOTA", 310, y + 24);
                ctx.fillText("PEKERJAAN", 520, y + 24);
                ctx.fillText("BERAT (KG)", 660, y + 24);

                y += 38;
                laundryData.forEach((item, index) => {
                    ctx.fillStyle = index % 2 === 0 ? "#FFFFFF" : "#F1F5F9";
                    ctx.fillRect(35, y, 730, 38);
                    ctx.strokeStyle = "#E2E8F0";
                    ctx.strokeRect(35, y, 730, 38);

                    ctx.fillStyle = "#0F172A";
                    ctx.font = "13px sans-serif";
                    ctx.fillText(String(index + 1), 50, y + 24);
                    ctx.fillText(item.nama.substring(0, 24), 95, y + 24);
                    ctx.fillText(item.resi.substring(0, 22), 310, y + 24);
                    ctx.font = "bold 12px sans-serif";
                    ctx.fillStyle = "#1D4ED8";
                    ctx.fillText(item.pekerjaan, 520, y + 24);
                    ctx.fillStyle = "#0F172A";
                    ctx.font = "bold 14px sans-serif";
                    ctx.fillText(`${Number(item.berat).toFixed(1)} Kg`, 660, y + 24);
                    y += 38;
                });

                const link = document.createElement("a");
                link.download = `1_Data_Rekap_${employeeName || "Laundry"}_${new Date().toISOString().slice(0,10)}.jpg`;
                link.href = canvas.toDataURL("image/jpeg", 0.95);
                link.click();
            };

            const generateOfficialFormJPEG = () => {
                const canvas = document.createElement("canvas");
                canvas.width = 1240;
                canvas.height = 1750;
                const ctx = canvas.getContext("2d");

                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = "#1E3A8A";
                ctx.lineWidth = 2.5;
                ctx.strokeRect(60, 50, 1120, 75);

                ctx.fillStyle = "#0F296B";
                ctx.font = "bold 36px Arial";
                ctx.textAlign = "center";
                ctx.fillText("FORMULIR KERJA HARIAN", canvas.width / 2, 100);

                ctx.textAlign = "left";
                ctx.font = "bold 16px Arial";
                ctx.fillStyle = "#0F296B";
                ctx.fillText("NAMA KARYAWAN  :", 60, 165);
                ctx.fillText("HARI / TANGGAL    :", 620, 165);

                ctx.strokeStyle = "#64748B";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(230, 168); ctx.lineTo(480, 168);
                ctx.moveTo(790, 168); ctx.lineTo(1080, 168);
                ctx.stroke();

                ctx.font = "bold 18
